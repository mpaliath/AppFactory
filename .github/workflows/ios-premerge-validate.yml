name: iOS Pre-Merge Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  validate_ios_archive:
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    env:
      IOS_PROJECT_PATH: HelloWorldiOS/HelloWorldiOS.xcodeproj
      IOS_SCHEME: HelloWorldiOS
      IOS_CONFIGURATION: Release
      BUNDLE_ID: com.appfactory.HelloWorldiOS
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest-stable

      - name: Validate signing secrets
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID secret"; exit 1; }
          test -n "$PROVISIONING_PROFILE_SPECIFIER" || { echo "Missing IOS_PROVISIONING_PROFILE_SPECIFIER secret"; exit 1; }

      - name: Install Certificates and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/temp-keychain.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS archive (validation)
        run: |
          xcodebuild \
            -project "$IOS_PROJECT_PATH" \
            -scheme "$IOS_SCHEME" \
            -sdk iphoneos \
            -configuration "$IOS_CONFIGURATION" \
            -archivePath "$RUNNER_TEMP/HelloWorldiOS-validate.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            archive
